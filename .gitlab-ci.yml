stages:
  - lint
  - test
  - build
  - report
  - deploy

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

variables:
  APP_DEPLOY_NAME: ganeshagoods-stg-frontend
  IMAGE: "kat-harbor.itb.ac.id/library/frontend-ecommerce"
  CI_BUN_IMAGE: "kat-harbor.itb.ac.id/hub-cache/oven/bun:1-alpine"
  CI_ALPINE_IMAGE: "kat-harbor.itb.ac.id/hub-cache/library/alpine:3.24"
  CI_KANIKO_IMAGE: "kat-harbor.itb.ac.id/gcr-cache/kaniko-project/executor:debug"
  HARBOR_PROJECT: "library"
  HARBOR_REPOSITORY: "frontend-ecommerce"
  SECRET_DETECTION_ENABLED: "true"
  NEXT_TELEMETRY_DISABLED: "1"

default:
  tags:
    - general

.bun-base:
  image: $CI_BUN_IMAGE
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

lint:
  extends: .bun-base
  stage: lint
  script:
    - bun install --frozen-lockfile
    - bun run lint

test:
  extends: .bun-base
  stage: test
  script:
    - bun install --frozen-lockfile
    - bun run build

build:
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_COMMIT_TAG
  tags:
    - kaniko
  image:
    name: $CI_KANIKO_IMAGE
    entrypoint: [""]
  script:
    - |
      AUTH=$(printf "%s:%s" "$HARBOR_USERNAME" "$HARBOR_PASSWORD" | base64)
      mkdir -p /kaniko/.docker
      printf '{"auths":{"kat-harbor.itb.ac.id":{"auth":"%s"}}}\n' "$AUTH" > /kaniko/.docker/config.json
    - /kaniko/executor --context "${CI_PROJECT_DIR}" --dockerfile "${CI_PROJECT_DIR}/Dockerfile" --destination "${IMAGE}:${CI_COMMIT_SHORT_SHA}" --label "org.opencontainers.image.revision=${CI_COMMIT_SHA}" --label "org.opencontainers.image.source=${CI_PROJECT_URL}"

mr_ci_report:
  stage: report
  image: $CI_ALPINE_IMAGE
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - if: $CI_COMMIT_BRANCH != "staging"
      when: always
  script:
    - apk add --no-cache curl jq
    - |
      api() {
        gitlab_token="${GITLAB_COMMENT_TOKEN:-${GITLAB_TOKEN:-}}"
        if [ -n "$gitlab_token" ]; then
          curl -fsS --header "PRIVATE-TOKEN: ${gitlab_token}" "$@"
        else
          curl -fsS --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "$@"
        fi
      }

      jobs="$(api "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/pipelines/${CI_PIPELINE_ID}/jobs?per_page=100")"
      summary="$(printf '%s' "$jobs" | jq -r '
        def wanted: ["lint", "test", "semgrep-sast", "secret_detection"];
        [.[] | select(.name as $name | wanted | index($name))]
        | sort_by(.name)
        | map("- \(.name): **\(.status)** ([job](\(.web_url)))")
        | join("\n")
      ')"
      body="$(printf 'CI result for `%s` (%s):\n\n%s\n\nHarbor Trivy: not available in MR pipeline because image build/push runs only on `staging`/tags. Staging pipeline will query Harbor Trivy for `%s:%s` after push.' "${CI_COMMIT_REF_NAME}" "${CI_COMMIT_SHORT_SHA}" "$summary" "$IMAGE" "$CI_COMMIT_SHORT_SHA")"

      mr_iid="${CI_MERGE_REQUEST_IID:-}"
      if [ -z "$mr_iid" ]; then
        mr_iid="$(api -G "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests" \
          --data-urlencode "state=opened" \
          --data-urlencode "source_branch=${CI_COMMIT_REF_NAME}" | jq -r '.[0].iid // empty')"
      fi
      if [ -z "$mr_iid" ]; then
        echo "No open MR found for ${CI_COMMIT_REF_NAME}; skipping CI result comment"
        exit 0
      fi

      if ! api -X POST "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${mr_iid}/notes" \
        --data-urlencode "body=${body}"; then
        echo "ERROR: unable to post MR CI result comment; set masked GITLAB_COMMENT_TOKEN or GITLAB_TOKEN with API scope"
        exit 1
      fi

harbor_trivy_report:
  stage: report
  image: $CI_ALPINE_IMAGE
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_COMMIT_TAG
  needs:
    - build
  script:
    - apk add --no-cache curl jq
    - |
      api() {
        gitlab_token="${GITLAB_COMMENT_TOKEN:-${GITLAB_TOKEN:-}}"
        if [ -n "$gitlab_token" ]; then
          curl -fsS --header "PRIVATE-TOKEN: ${gitlab_token}" "$@"
        else
          curl -fsS --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "$@"
        fi
      }

      harbor_artifact="https://kat-harbor.itb.ac.id/api/v2.0/projects/${HARBOR_PROJECT}/repositories/${HARBOR_REPOSITORY}/artifacts/${CI_COMMIT_SHORT_SHA}"
      curl -fsS -u "${HARBOR_USERNAME}:${HARBOR_PASSWORD}" -X POST "${harbor_artifact}/scan" || true

      report=""
      for _ in $(seq 1 30); do
        report="$(curl -fsS -u "${HARBOR_USERNAME}:${HARBOR_PASSWORD}" \
          -H "Accept: application/vnd.security.vulnerability.report; version=1.1" \
          "${harbor_artifact}/additions/vulnerabilities" || true)"
        if printf '%s' "$report" | jq -e 'to_entries | length > 0' >/dev/null 2>&1; then
          break
        fi
        sleep 10
      done

      trivy_summary="$(printf '%s' "$report" | jq -r '
        (to_entries[0].value.summary.summary // {}) as $s
        | "Critical: \($s.Critical // 0), High: \($s.High // 0), Medium: \($s.Medium // 0), Low: \($s.Low // 0), Unknown: \($s.Unknown // 0)"
      ' 2>/dev/null || echo "No Harbor vulnerability report available yet")"
      body="$(printf 'Harbor Trivy result for `%s:%s`:\n\n%s\n\nArtifact: `%s/%s:%s`' "$HARBOR_REPOSITORY" "$CI_COMMIT_SHORT_SHA" "$trivy_summary" "$HARBOR_PROJECT" "$HARBOR_REPOSITORY" "$CI_COMMIT_SHORT_SHA")"

      related_mr="$(api "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/commits/${CI_COMMIT_SHA}/merge_requests" | jq -r '[.[] | select(.state == "opened")][0].iid // empty' || true)"
      if [ -n "$related_mr" ]; then
        if ! api -X POST "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${related_mr}/notes" --data-urlencode "body=${body}"; then
          echo "ERROR: unable to post Harbor Trivy MR comment; set masked GITLAB_COMMENT_TOKEN or GITLAB_TOKEN with API scope"
          exit 1
        fi
      else
        if ! api -X POST "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/commits/${CI_COMMIT_SHA}/comments" --data-urlencode "note=${body}"; then
          echo "ERROR: unable to post Harbor Trivy commit comment; set masked GITLAB_COMMENT_TOKEN or GITLAB_TOKEN with API scope"
          exit 1
        fi
      fi

deploy:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_COMMIT_TAG
  needs:
    - build
  tags:
    - deploy
  image: $CI_ALPINE_IMAGE
  script:
    - apk add --no-cache git sed grep
    - |
      if ! echo "$APP_DEPLOY_NAME" | grep -Eq '^[a-zA-Z0-9_-]+$'; then
        echo "SECURITY ERROR: APP_DEPLOY_NAME ($APP_DEPLOY_NAME) contains invalid characters"
        exit 1
      fi
    - git clone https://oauth2:${GIT_TOKEN}@github.com/KAT-ITB-2026/kat-argo-apps.git
    - cd kat-argo-apps
    - TARGET_FILE="apps/stg/${APP_DEPLOY_NAME}/values.yaml"
    - test -f "$TARGET_FILE"
    - 'sed -i "s/^  tag:.*/  tag: ${CI_COMMIT_SHORT_SHA}/" "$TARGET_FILE"'
    - git config user.name "GitLab CI"
    - git config user.email "ci@gitlab.com"
    - git add "$TARGET_FILE"
    - 'git commit -m "deploy: update ${APP_DEPLOY_NAME} to ${CI_COMMIT_SHORT_SHA}" || exit 0'
    - git push origin main
