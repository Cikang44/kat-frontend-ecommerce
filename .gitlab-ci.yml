include:
  - local: .gitlab/ci/common.yml

variables:
  APP_DEPLOY_NAME: ganeshagoods-stg-frontend
  IMAGE: "kat-harbor.itb.ac.id/library/frontend-ecommerce"
  CI_BUN_IMAGE: "kat-harbor.itb.ac.id/hub-cache/oven/bun:1-alpine"
  CI_ALPINE_IMAGE: "kat-harbor.itb.ac.id/hub-cache/library/alpine:3.24"
  CI_KANIKO_IMAGE: "kat-harbor.itb.ac.id/gcr-cache/kaniko-project/executor:debug"
  HARBOR_PROJECT: "library"
  HARBOR_REPOSITORY: "frontend-ecommerce"
  SECRET_DETECTION_ENABLED: "true"
  NEXT_TELEMETRY_DISABLED: "1"

lint:
  extends: .bun-base
  stage: lint
  script:
    - bun install --frozen-lockfile
    - bun run lint

test:
  extends: .bun-base
  stage: test
  script:
    - bun install --frozen-lockfile
    - bun run build
